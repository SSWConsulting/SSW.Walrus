name: Build & Deploy (Azure)

# Keyless: GitHub OIDC -> Azure (federated credential on id-walrus-deploy).
# Builds the image server-side with `az acr build` (no Docker), then deploys the
# Bicep (Container App Job + Logic App).
#
# The target environment is driven by repo variables so moving between
# subscriptions is a variable flip, not a code change:
#   WALRUS_ENVIRONMENT    staging (default) | prod  -- also picks the bicepparam
#   AZURE_RESOURCE_GROUP  rg-walrus-staging (default)
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   WALRUS_DEPLOY_CONNECTIONS  true (default) | false once the SharePoint/Outlook
#                              connections are authorised, if redeploys reset them
# Every other resource name is derived below exactly as infra/modules/*.bicep
# derives it, so the workflow and the templates stay in step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  WALRUS_ENVIRONMENT: ${{ vars.WALRUS_ENVIRONMENT || 'staging' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-walrus-staging' }}
  ACR_NAME: acrwalrus${{ vars.WALRUS_ENVIRONMENT || 'staging' }}
  IMAGE: walrus-processor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR (server-side)
        run: |
          # Idempotent: ensures the registry exists so the Bicep deploy of the
          # Container App Job (which validates the image manifest) succeeds.
          az acr create -n "$ACR_NAME" -g "$AZURE_RESOURCE_GROUP" --sku Basic -o none
          az acr build -r "$ACR_NAME" -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "infra/${WALRUS_ENVIRONMENT}.bicepparam" \
            --parameters imageTag=latest \
            --parameters deployConnections=${{ vars.WALRUS_DEPLOY_CONNECTIONS || 'true' }}
