name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ssw-fatdigester-rg
  AZURE_LOCATION: australiaeast
  PYTHON_VERSION: '3.11'

jobs:
  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      webAppName: ${{ steps.deploy-infra.outputs.webAppName }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.AZURE_RESOURCE_GROUP }} \
          --location ${{ env.AZURE_LOCATION }}
    
    - name: Deploy Bicep Infrastructure
      id: deploy-infra
      run: |
        # Check if Key Vault already exists (from setup script)
        KV_EXISTS=$(az keyvault list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?starts_with(name, 'ssw-fatdigester-kv')].name | [0]" -o tsv || echo "")
        
        if [ -n "$KV_EXISTS" ]; then
          echo "Using existing Key Vault: $KV_EXISTS"
          PARAMS="keyVaultName='$KV_EXISTS' environment=prod"
        else
          echo "Key Vault not found. Using parameters from GitHub Secrets."
          PARAMS="azureOpenAIApiKey='${{ secrets.AZURE_OPENAI_API_KEY }}' azureOpenAIEndpoint='${{ secrets.AZURE_OPENAI_ENDPOINT }}' azureOpenAIDeploymentName='${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}' environment=prod"
        fi
        
        output=$(az deployment group create \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters $PARAMS \
          --output json)
        
        webAppName=$(echo $output | jq -r '.properties.outputs.webAppName.value')
        echo "webAppName=$webAppName" >> $GITHUB_OUTPUT
        echo "Deployed to: $webAppName"

  deploy:
    name: Deploy Application
    needs: infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ needs.infrastructure.outputs.webAppName }}
        startup-command: 'python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'

